    let db = null;

    function initDb() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          db = JSON.parse(stored);
          if (!db.machines && db.products) {
            // Migrate legacy schema if needed
            db.machines = db.products.map(p => ({
              id: p.id.replace('PRD', 'MCH'),
              name: p.name,
              motor: 'Standard Industrial Motor',
              capacity: 'Factory Standard Capacity',
              hsn: p.hsn || '8436',
              price: p.price || 50000,
              gstRate: p.gstRate || 18,
              desc: p.desc || ''
            }));
            delete db.products;
            saveDb();
          }
        } catch (e) {
          db = JSON.parse(JSON.stringify(DEFAULT_SEED_DATA));
        }
      } else {
        db = JSON.parse(JSON.stringify(DEFAULT_SEED_DATA));
        saveDb();
      }
    }

    function saveDb() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    function resetToSampleData() {
      if (confirm("Reset application to standard initial data? All tables will be restored.")) {
        db = JSON.parse(JSON.stringify(DEFAULT_SEED_DATA));
        saveDb();
        renderActiveView();
        showNotification("Reset to sample machinery & accounts completed.");
      }
    }

    /* ------------------------------------------------------------------
       2. STRICT SEQUENTIAL ID GENERATOR (001, 002, 003...)
       ------------------------------------------------------------------ */
    function getNextSequentialId(prefix, list) {
      const year = '2026';
      const searchPrefix = `${prefix}-${year}-`;
      let highestNum = 0;

      if (Array.isArray(list)) {
        list.forEach(item => {
          if (item && item.id && item.id.startsWith(searchPrefix)) {
            const numPart = parseInt(item.id.replace(searchPrefix, ''), 10);
            if (!isNaN(numPart) && numPart > highestNum) {
              highestNum = numPart;
            }
          }
        });
      }
      return `${searchPrefix}${String(highestNum + 1).padStart(3, '0')}`;
    }

    function getNextSimpleId(prefix, list) {
      let highestNum = 0;
      if (Array.isArray(list)) {
        list.forEach(item => {
          if (item && item.id && item.id.startsWith(prefix + '-')) {
            const numPart = parseInt(item.id.replace(prefix + '-', ''), 10);
            if (!isNaN(numPart) && numPart > highestNum) {
              highestNum = numPart;
            }
          }
        });
      }
      return `${prefix}-${String(highestNum + 1).padStart(3, '0')}`;
    }

    function sortBySequence(arr) {
      return [...arr].sort((a, b) => (a.id > b.id ? 1 : -1));
    }

    /* ------------------------------------------------------------------
       3. FINANCIAL & DUES CALCULATION ENGINE
       ------------------------------------------------------------------ */
    function getDocumentFinancials(docId) {
      let grandTotal = 0;
      let customerName = '';
      let title = '';

      const so = db.salesOrders.find(s => s.id === docId);
      if (so) {
        grandTotal = Number(so.grandTotal) || 0;
        customerName = so.customerName;
        title = `Sales Order ${so.id}`;
      }

      const inv = db.invoices.find(i => i.id === docId);
      if (inv) {
        grandTotal = Number(inv.grandTotal) || 0;
        customerName = inv.customerName;
        title = `Invoice ${inv.id}`;
      }

      // Sum matching payments
      let totalPaid = 0;
      db.payments.forEach(p => {
        if (p.docId === docId) {
          totalPaid += (Number(p.amount) || 0);
        } else if (so && so.invoiceId && p.docId === so.invoiceId) {
          totalPaid += (Number(p.amount) || 0);
        } else if (inv && inv.soId && p.docId === inv.soId) {
          totalPaid += (Number(p.amount) || 0);
        }
      });

      const remainingBalance = Math.max(0, grandTotal - totalPaid);
      let status = 'Unpaid';
      if (totalPaid >= grandTotal && grandTotal > 0) {
        status = 'Paid';
      } else if (totalPaid > 0 && remainingBalance > 0) {
        status = 'Partially Paid';
      }

      return {
        grandTotal,
        totalPaid,
        remainingBalance,
        status,
        customerName,
        title
      };
    }

    function formatCurrency(amount) {
      const val = Number(amount) || 0;
      return '₹ ' + val.toLocaleString('en-IN');
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const parts = dateStr.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dateStr;
    }

    function convertQuoteToSo(quoteId) {
      const q = db.quotations.find(item => item.id === quoteId);
      if (!q) return;

      const newSoId = getNextSequentialId('SO', db.salesOrders);
      db.salesOrders.push({
        id: newSoId,
        quotationId: q.id,
        date: new Date().toISOString().split('T')[0],
        customerId: q.customerId,
        customerName: q.customerName,
        items: JSON.parse(JSON.stringify(q.items)),
        taxableSubtotal: q.taxableSubtotal,
        cgst: q.cgst,
        sgst: q.sgst,
        totalGst: q.totalGst,
        grandTotal: q.grandTotal,
        deliveryDate: new Date(Date.now() + 15 * 86400000).toISOString().split('T')[0],
        status: 'In Production',
        invoiceId: null
      });

      q.status = 'Converted to SO';
      saveDb();
      showNotification(`Quotation converted to Sales Order: ${newSoId}`);
      navigateTo('salesOrders');
    }

      const nextReceiptId = getNextSequentialId('REC', db.payments);

    function onPaymentDocChange() {
      const select = document.getElementById('pay-doc-selector');
      const opt = select.options[select.selectedIndex];
      if (opt && opt.value) {
        const total = Number(opt.getAttribute('data-total')) || 0;
        const paid = Number(opt.getAttribute('data-paid')) || 0;
        const balance = Number(opt.getAttribute('data-balance')) || 0;

        document.getElementById('pay-disp-total').textContent = formatCurrency(total);
        document.getElementById('pay-disp-paid').textContent = formatCurrency(paid);
        document.getElementById('pay-disp-balance').textContent = formatCurrency(balance);

        const amtInput = document.getElementById('pay-amount-input');
        if (!amtInput.value || Number(amtInput.value) > balance) {
          amtInput.value = balance;
        }
        calcLiveRemainingBalance();
      } else {
        document.getElementById('pay-disp-total').textContent = '₹ 0';
        document.getElementById('pay-disp-paid').textContent = '₹ 0';
        document.getElementById('pay-disp-balance').textContent = '₹ 0';
        document.getElementById('pay-disp-live-row').classList.add('hidden');
      }
    }

    function setFullBalancePay() {
      const select = document.getElementById('pay-doc-selector');
      const opt = select.options[select.selectedIndex];
      if (opt && opt.value) {
        const balance = Number(opt.getAttribute('data-balance')) || 0;
        document.getElementById('pay-amount-input').value = balance;
        calcLiveRemainingBalance();
      }
    }

    function calcLiveRemainingBalance() {
      const select = document.getElementById('pay-doc-selector');
      const opt = select.options[select.selectedIndex];
      const amtInput = document.getElementById('pay-amount-input');
      const liveRow = document.getElementById('pay-disp-live-row');
      const liveSpan = document.getElementById('pay-disp-live-balance');

      if (!opt || !opt.value) return;
      const balance = Number(opt.getAttribute('data-balance')) || 0;
      const paying = Number(amtInput.value) || 0;

      if (paying > 0) {
        liveRow.classList.remove('hidden');
        const rem = Math.max(0, balance - paying);
        if (rem === 0) {
          liveSpan.innerHTML = `<span class="text-emerald-600 font-bold">₹ 0 (Fully Settled)</span>`;
        } else {
          liveSpan.innerHTML = `<span class="text-amber-600 font-bold">${formatCurrency(rem)} (Partial)</span>`;
        }
      } else {
        liveRow.classList.add('hidden');
      }
    }

    function savePaymentForm(e, nextReceiptId) {
      e.preventDefault();
      const select = document.getElementById('pay-doc-selector');
      const opt = select.options[select.selectedIndex];
      if (!opt || !opt.value) return;

      const docId = opt.value;
      const customerName = opt.getAttribute('data-customer');
      const amount = Number(document.getElementById('pay-amount-input').value) || 0;
      const date = document.getElementById('pay-date-input').value;
      const method = document.getElementById('pay-method-select').value;
      const refNo = document.getElementById('pay-ref-input').value;
      const notes = document.getElementById('pay-notes-input').value;

      if (amount <= 0) {
        showNotification("Please enter a valid amount.");
        return;
      }

      db.payments.push({
        id: nextReceiptId,
        date,
        docId,
        customerName,
        amount,
        method,
        refNo,
        notes
      });

      saveDb();
      closeFormModal();
      showNotification(`Payment recorded. Receipt ${nextReceiptId} generated.`);
      navigateTo('payments');
    }

    function syncRowMachine(rowId) {
      const row = document.getElementById(rowId);
      if (!row) return;
      const select = row.querySelector('.row-mch-select');
      const opt = select.options[select.selectedIndex];
      if (opt) {
        row.querySelector('.row-price').value = opt.getAttribute('data-price') || 0;
        row.querySelector('.row-hsn').value = opt.getAttribute('data-hsn') || '8436';
        row.querySelector('.row-gst-rate').value = opt.getAttribute('data-gstr') || 18;
        const motor = opt.getAttribute('data-motor') || '';
        const capacity = opt.getAttribute('data-capacity') || '';
        row.querySelector('.row-specs').value = `${motor} | ${capacity}`;
      }
      recalculateFormTotals();
    }

    function recalculateFormTotals() {
      let taxableSubtotal = 0;
      let totalGst = 0;

      document.querySelectorAll('.item-entry-row').forEach(row => {
        const price = Number(row.querySelector('.row-price').value) || 0;
        const qty = Number(row.querySelector('.row-qty').value) || 1;
        const gstRate = Number(row.querySelector('.row-gst-rate').value) || 0;

        const lineTaxable = price * qty;
        const lineGst = Math.round(lineTaxable * (gstRate / 100));

        taxableSubtotal += lineTaxable;
        totalGst += lineGst;
      });

      const grandTotal = taxableSubtotal + totalGst;

      const taxableDisp = document.getElementById('calc-taxable-disp');
      const gstDisp = document.getElementById('calc-gst-disp');
      const grandDisp = document.getElementById('calc-grand-disp');

      if (taxableDisp) taxableDisp.textContent = formatCurrency(taxableSubtotal);
      if (gstDisp) gstDisp.textContent = formatCurrency(totalGst);
      if (grandDisp) grandDisp.textContent = formatCurrency(grandTotal);
    }

    function saveQuotationForm(e, nextId) {
      e.preventDefault();
      const custId = document.getElementById('form-q-customer').value;
      const cust = db.customers.find(c => c.id === custId);
      if (!cust) return;

      const items = [];
      let taxableSubtotal = 0;
      let totalGst = 0;

      document.querySelectorAll('.item-entry-row').forEach(row => {
        const select = row.querySelector('.row-mch-select');
        const opt = select.options[select.selectedIndex];
        const machineId = opt ? opt.value : 'MCH-001';
        const name = opt ? opt.getAttribute('data-name') : 'Poultry Machine';
        const specs = row.querySelector('.row-specs').value || '';
        const hsn = row.querySelector('.row-hsn').value || '8436';
        const price = Number(row.querySelector('.row-price').value) || 0;
        const qty = Number(row.querySelector('.row-qty').value) || 1;
        const gstRate = Number(row.querySelector('.row-gst-rate').value) || 0;

        const taxable = price * qty;
        const gstAmount = Math.round(taxable * (gstRate / 100));
        const total = taxable + gstAmount;

        taxableSubtotal += taxable;
        totalGst += gstAmount;

        items.push({ machineId, name, specs, hsn, qty, price, taxable, gstRate, gstAmount, total });
      });

      const cgst = Math.round(totalGst / 2);
      const sgst = Math.round(totalGst / 2);
      const grandTotal = taxableSubtotal + totalGst;

      db.quotations.push({
        id: nextId,
        date: document.getElementById('form-q-date').value,
        customerId: cust.id,
        customerName: cust.name,
        items,
        taxableSubtotal,
        cgst,
        sgst,
        totalGst,
        grandTotal,
        status: 'Pending'
      });

      saveDb();
      closeFormModal();
      showNotification(`Quotation ${nextId} created successfully.`);
      navigateTo('quotations');
    }

              <tbody>
                ${doc.items.map((item, index) => `
                  <tr class="hover:bg-slate-50/50">
                    <td class="p-2 border border-slate-300 text-center">${index + 1}</td>
                    <td class="p-2 border border-slate-300">
                      <p class="font-bold text-slate-900">${item.name}</p>
                      ${item.specs ? `<p class="text-[10px] text-slate-500">${item.specs}</p>` : ''}
                    </td>
                    <td class="p-2 border border-slate-300 text-center font-mono">${item.hsn}</td>
                    <td class="p-2 border border-slate-300 text-center font-bold">${item.qty}</td>
                    <td class="p-2 border border-slate-300 text-right">${formatCurrency(item.price)}</td>
                    <td class="p-2 border border-slate-300 text-right font-medium">${formatCurrency(item.taxable || (item.price * item.qty))}</td>
                    <td class="p-2 border border-slate-300 text-center font-semibold text-slate-700">${item.gstRate || 18}%</td>
                    <td class="p-2 border border-slate-300 text-right font-bold text-slate-900">${formatCurrency(item.total)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <!-- Financial Summary & Bank Information -->
            <div class="grid grid-cols-2 gap-4 items-start pt-2">
              <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-lg text-xs space-y-1">
                <p class="font-bold text-slate-900 uppercase text-[10px] tracking-wide mb-1.5 flex items-center">
                  <i data-lucide="building" class="w-3.5 h-3.5 mr-1 text-slate-700"></i>
                  Bank Wire / RTGS Settlement Details
                </p>
                <p class="text-slate-600">Bank Name: <strong class="text-slate-900">${comp.bankName}</strong></p>
                <p class="text-slate-600">Account No: <strong class="text-slate-900 font-mono">${comp.accountNo}</strong></p>
                <p class="text-slate-600">IFSC Code: <strong class="text-slate-900 font-mono">${comp.ifscCode}</strong></p>
                <p class="text-slate-600">Branch: <span class="text-slate-800">${comp.branch}</span></p>
                <p class="text-slate-600">UPI ID: <span class="text-slate-900 font-mono font-medium">${comp.upiId}</span></p>
              </div>

              <div class="bg-slate-50 p-3.5 border border-slate-200 rounded-lg space-y-1.5 text-xs">
                <div class="flex justify-between text-slate-600">
                  <span>Taxable Subtotal:</span>
                  <span class="font-semibold text-slate-800">${formatCurrency(doc.taxableSubtotal)}</span>
                </div>
                <div class="flex justify-between text-slate-600">
                  <span>CGST (Central Tax):</span>
                  <span>${formatCurrency(doc.cgst || Math.round(doc.totalGst / 2))}</span>
                </div>
                <div class="flex justify-between text-slate-600">
                  <span>SGST (State Tax):</span>
                  <span>${formatCurrency(doc.sgst || Math.round(doc.totalGst / 2))}</span>
                </div>
                <div class="flex justify-between pt-1.5 border-t border-slate-300 font-bold text-slate-900 text-sm">
                  <span>Grand Total Amount:</span>
                  <span class="text-emerald-700 font-mono">${formatCurrency(doc.grandTotal)}</span>
                </div>
                ${fin ? `
                  <div class="flex justify-between pt-1 border-t border-slate-200 text-slate-700">
                    <span>Total Amount Paid:</span>
                    <span class="font-bold text-emerald-600">${formatCurrency(fin.totalPaid)}</span>
                  </div>
                  <div class="flex justify-between font-bold text-xs pt-1 ${fin.remainingBalance > 0 ? 'text-amber-700 bg-amber-50 p-1.5 rounded border border-amber-200' : 'text-slate-500'}">
                    <span>Remaining Balance Due:</span>
                    <span class="font-mono text-sm">${formatCurrency(fin.remainingBalance)}</span>
                  </div>
                ` : ''}
              </div>
            </div>

            <!-- Standard Machinery Terms and Authorized Signatory -->
            <div class="pt-6 border-t border-slate-200 grid grid-cols-2 gap-4 items-end">
              <div class="text-[10px] text-slate-500 space-y-0.5">
                <p class="font-bold text-slate-700 uppercase tracking-wider mb-1">Standard Machinery Terms:</p>
                <p>1. Warranty: 12 months guarantee for main shafts, rotors & bearings against mfg defects.</p>
                <p>2. Payment: Advance booking as specified; balance strictly prior to factory dispatch.</p>
                <p>3. Jurisdiction: All disputes subject to Nashik jurisdiction only.</p>
              </div>

              <div class="text-center flex flex-col items-end">
                <p class="text-xs font-bold text-slate-900 mb-12">For AVS Agro Engineers</p>
                <div class="w-44 border-t border-slate-400 pt-1 text-center">
                  <p class="text-[11px] text-slate-600 font-medium">Authorized Signatory</p>
                </div>
              </div>
            </div>

          </div>
        `;
      } else if (type === 'receipt') {
        const p = db.payments.find(item => item.id === id);
        if (!p) return;

        container.innerHTML = `
          <div class="space-y-6">
            <div class="flex justify-between items-start pb-5 border-b-2 border-emerald-800">
              <div>
                <h1 class="text-xl font-bold tracking-tight text-slate-950 uppercase">${comp.name}</h1>
                <p class="text-[11px] font-semibold text-slate-700 mt-0.5">${comp.tagline}</p>
                <p class="text-[11px] text-slate-600 mt-1">${comp.address}</p>
                <p class="text-[11px] text-slate-800 mt-1"><strong>GSTIN:</strong> ${comp.gstin}</p>
              </div>

              <div class="text-right">
                <span class="inline-block px-3 py-1 bg-emerald-700 text-white font-bold text-xs uppercase tracking-wider rounded font-mono mb-2">
                  OFFICIAL RECEIPT
                </span>
                <p class="text-base font-black font-mono text-slate-900">${p.id}</p>
                <p class="text-xs text-slate-600 mt-1">Receipt Date: <strong>${formatDate(p.date)}</strong></p>
              </div>
            </div>

            <div class="bg-slate-50 p-5 rounded-lg border border-slate-200 space-y-3 text-xs">
              <p class="text-slate-700">
                Received with thanks from: <strong class="text-slate-900 text-sm font-bold block mt-1">${p.customerName}</strong>
              </p>

              <div class="grid grid-cols-2 gap-4 pt-3 border-t border-slate-200">
                <div>
                  <span class="text-slate-500 block text-[11px]">Against Order / Invoice Ref:</span>
                  <span class="font-mono font-bold text-slate-800 text-sm">${p.docId}</span>
                </div>
                <div>
                  <span class="text-slate-500 block text-[11px]">Payment Mode:</span>
                  <span class="font-bold text-slate-800 text-sm">${p.method}</span>
                </div>
              </div>

              <div class="pt-2 border-t border-slate-200">
                <span class="text-slate-500 block text-[11px]">Transaction UTR / Cheque Ref:</span>
                <span class="font-mono font-bold text-slate-900 text-xs">${p.refNo || '-'}</span>
              </div>

              ${p.notes ? `
                <div class="pt-2 border-t border-slate-200">
                  <span class="text-slate-500 block text-[11px]">Notes:</span>
                  <span class="text-slate-700">${p.notes}</span>
                </div>
              ` : ''}
            </div>

            <div class="bg-emerald-50 border border-emerald-300 p-4 rounded-lg flex justify-between items-center">
              <div>
                <span class="font-bold text-emerald-900 text-xs uppercase tracking-wider block">Total Amount Received (INR)</span>
                <span class="text-[11px] text-emerald-700">Payment credited & verified</span>
              </div>
              <span class="text-2xl font-black text-emerald-700 font-mono">${formatCurrency(p.amount)}</span>
            </div>

            <div class="pt-8 border-t border-slate-200 flex justify-between items-end">
              <p class="text-[10px] text-slate-400">Computer generated official acknowledgment receipt.</p>
              <div class="text-center">
                <p class="text-xs font-bold text-slate-900 mb-12">For AVS Agro Engineers</p>
                <div class="w-40 border-t border-slate-400 pt-1">
                  <p class="text-[11px] text-slate-500">Accounts Department</p>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (type === 'po') {
        const po = db.pos.find(item => item.id === id);
        if (!po) return;

        container.innerHTML = `
          <div class="space-y-6">
            <div class="flex justify-between items-start pb-5 border-b-2 border-slate-900">
              <div>
                <h1 class="text-xl font-bold tracking-tight text-slate-950 uppercase">${comp.name}</h1>
                <p class="text-[11px] font-semibold text-slate-700 mt-0.5">Procurement & Stores Department</p>
                <p class="text-[11px] text-slate-600 mt-1">${comp.address}</p>
                <p class="text-[11px] text-slate-800 mt-1"><strong>GSTIN:</strong> ${comp.gstin}</p>
              </div>

              <div class="text-right">
                <span class="inline-block px-3 py-1 bg-slate-900 text-white font-bold text-xs uppercase tracking-wider rounded font-mono mb-2">
                  PURCHASE ORDER
                </span>
                <p class="text-base font-black font-mono text-slate-900">${po.id}</p>
                <p class="text-xs text-slate-600 mt-1">Date: <strong>${formatDate(po.date)}</strong></p>
                <p class="text-xs text-slate-600">Expected Delivery: <strong>${formatDate(po.deliveryDate)}</strong></p>
              </div>
            </div>

            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 text-xs">
              <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">Approved Vendor / Supplier</p>
              <p class="font-bold text-slate-900 text-sm">${po.vendorName}</p>
              <p class="text-slate-600 mt-0.5">${po.vendorAddress || 'MIDC Industrial Area'}</p>
              <p class="text-slate-700 mt-1"><strong>GSTIN:</strong> <span class="font-mono">${po.vendorGst}</span></p>
            </div>

            <table class="w-full text-left text-xs border border-slate-300 border-collapse">
              <thead class="bg-slate-100 text-slate-800 uppercase font-semibold text-[10px]">
                <tr>
                  <th class="p-2 border border-slate-300 text-center w-8">#</th>
                  <th class="p-2 border border-slate-300">Raw Material Specification</th>
                  <th class="p-2 border border-slate-300 text-center w-16">HSN</th>
                  <th class="p-2 border border-slate-300 text-center w-12">Qty</th>
                  <th class="p-2 border border-slate-300 text-right w-24">Rate (₹)</th>
                  <th class="p-2 border border-slate-300 text-center w-14">GST %</th>
                  <th class="p-2 border border-slate-300 text-right w-28">Total (₹)</th>
                </tr>
              </thead>
              <tbody>
                ${po.items.map((item, index) => `
                  <tr>
                    <td class="p-2 border border-slate-300 text-center">${index + 1}</td>
                    <td class="p-2 border border-slate-300 font-medium">${item.name}</td>
                    <td class="p-2 border border-slate-300 text-center font-mono">${item.hsn}</td>
                    <td class="p-2 border border-slate-300 text-center font-bold">${item.qty}</td>
                    <td class="p-2 border border-slate-300 text-right">${formatCurrency(item.price)}</td>
                    <td class="p-2 border border-slate-300 text-center font-semibold text-slate-700">${item.gstRate}%</td>
                    <td class="p-2 border border-slate-300 text-right font-bold text-slate-900">${formatCurrency(item.total)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <div class="flex justify-end pt-2">
              <div class="w-64 bg-slate-50 p-3.5 border border-slate-200 rounded-lg text-xs space-y-1">
                <div class="flex justify-between text-slate-600">
                  <span>Taxable Subtotal:</span>
                  <span class="font-semibold text-slate-800">${formatCurrency(po.taxableSubtotal)}</span>
                </div>
                <div class="flex justify-between text-slate-600">
                  <span>GST Amount:</span>
                  <span>${formatCurrency(po.totalGst)}</span>
                </div>
                <div class="flex justify-between pt-1 border-t border-slate-300 font-bold text-slate-900 text-sm">
                  <span>Total PO Amount:</span>
                  <span class="text-slate-900 font-mono">${formatCurrency(po.grandTotal)}</span>
                </div>
              </div>
            </div>

            <div class="pt-8 border-t border-slate-200 flex justify-between items-end">
              <p class="text-[10px] text-slate-400">Deliver with Test Certificate (TC) to MIDC Ambad workshop.</p>
              <div class="text-center">
                <p class="text-xs font-bold text-slate-900 mb-12">For AVS Agro Engineers</p>
                <div class="w-40 border-t border-slate-400 pt-1">
                  <p class="text-[11px] text-slate-500">Purchase Manager</p>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      document.getElementById('print-modal-container').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeDocPreview() {
      document.getElementById('print-modal-container').classList.add('hidden');
    }

    /* ------------------------------------------------------------------
       8. INITIALIZATION LIFECYCLE
       ------------------------------------------------------------------ */
    window.addEventListener('DOMContentLoaded', () => {
      initDb();
      renderSidebarNav();
      renderActiveView();
    });
  </script>
</body>
</html>
